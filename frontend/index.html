<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Biscuit Classifier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f0e0d;
      --surface:   #1a1816;
      --border:    #2e2b27;
      --gold:      #d4a843;
      --gold-dim:  #8a6b28;
      --text:      #f0ead8;
      --muted:     #7a7060;
      --success:   #6fcf6f;
      --radius:    12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    /* subtle grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
    }

    /* ── Header ── */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header .eyebrow {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    header h1 {
      font-size: 2.4rem;
      font-weight: 800;
      line-height: 1.1;
      color: var(--text);
    }

    header h1 span {
      color: var(--gold);
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.75rem;
    }

    /* ── Drop Zone ── */
    #drop-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 2.5rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }

    #drop-zone:hover,
    #drop-zone.dragover {
      border-color: var(--gold);
      background: rgba(212, 168, 67, 0.05);
    }

    #drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .drop-icon {
      font-size: 2.2rem;
      margin-bottom: 0.75rem;
      display: block;
    }

    .drop-label {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .drop-label strong {
      color: var(--gold);
      font-weight: 600;
    }

    /* ── Preview ── */
    #preview-section {
      display: none;
      margin-top: 1.25rem;
    }

    #preview-section.visible {
      display: block;
    }

    #preview-img {
      width: 100%;
      max-height: 260px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border);
      display: block;
    }

    .preview-meta {
      margin-top: 0.6rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }

    /* ── Button ── */
    #predict-btn {
      margin-top: 1.25rem;
      width: 100%;
      padding: 0.9rem;
      background: var(--gold);
      color: #0f0e0d;
      border: none;
      border-radius: var(--radius);
      font-family: 'Syne', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }

    #predict-btn:hover:not(:disabled) {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    #predict-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ── Loading ── */
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(0,0,0,0.3);
      border-top-color: #0f0e0d;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── Result ── */
    #result-section {
      display: none;
      margin-top: 1.5rem;
      border-top: 1px solid var(--border);
      padding-top: 1.5rem;
    }

    #result-section.visible {
      display: block;
    }

    .result-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }

    .result-class {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--gold);
      margin-bottom: 1rem;
      word-break: break-word;
    }

    /* Confidence Bar */
    .confidence-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.4rem;
    }

    .confidence-title {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .confidence-pct {
      font-family: 'DM Mono', monospace;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--success);
    }

    .bar-track {
      background: var(--border);
      border-radius: 99px;
      height: 6px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--gold-dim), var(--gold));
      width: 0%;
      transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .raw-output {
      margin-top: 0.75rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      color: var(--muted);
    }

    /* ── Error ── */
    #error-box {
      display: none;
      margin-top: 1rem;
      padding: 0.85rem 1rem;
      background: rgba(220, 80, 80, 0.1);
      border: 1px solid rgba(220, 80, 80, 0.3);
      border-radius: 8px;
      font-family: 'DM Mono', monospace;
      font-size: 0.78rem;
      color: #e07070;
    }

    #error-box.visible {
      display: block;
    }

    /* ── Footer ── */
    footer {
      margin-top: 2rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      color: var(--muted);
      text-align: center;
      letter-spacing: 0.05em;
    }

    footer a {
      color: var(--gold-dim);
      text-decoration: none;
    }
  </style>
</head>
<body>

<div class="container">

  <header>
    <p class="eyebrow">AI Classification</p>
    <h1>Biscuit<br><span>Identifier</span></h1>
  </header>

  <div class="card">

    <!-- Drop Zone -->
    <div id="drop-zone">
      <input type="file" id="file-input" accept="image/*" />
      <span class="drop-icon">🍪</span>
      <p class="drop-label">
        <strong>Click to upload</strong> or drag & drop<br>
        PNG, JPG, WEBP supported
      </p>
    </div>

    <!-- Image Preview -->
    <div id="preview-section">
      <img id="preview-img" src="" alt="Preview" />
      <div class="preview-meta">
        <span id="file-name">—</span>
        <span id="file-size">—</span>
      </div>
    </div>

    <!-- Predict Button -->
    <button id="predict-btn" disabled>Classify Biscuit</button>

    <!-- Error Box -->
    <div id="error-box"></div>

    <!-- Result -->
    <div id="result-section">
      <p class="result-label">Predicted Class</p>
      <p class="result-class" id="result-class">—</p>

      <div class="confidence-row">
        <span class="confidence-title">Confidence</span>
        <span class="confidence-pct" id="confidence-pct">—</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" id="bar-fill"></div>
      </div>

      <p class="raw-output" id="raw-output"></p>
    </div>

  </div>

  <footer>
    Connected to <a href="http://localhost:5000/health" target="_blank">localhost:5000</a>
    &nbsp;·&nbsp; MobileNetV2 backend
  </footer>

</div>

<script>
  // ── Config ──────────────────────────────────────────────────────────────────
  const API_URL = "http://localhost:5000/predict";

  // ── DOM refs ────────────────────────────────────────────────────────────────
  const dropZone     = document.getElementById("drop-zone");
  const fileInput    = document.getElementById("file-input");
  const previewSec   = document.getElementById("preview-section");
  const previewImg   = document.getElementById("preview-img");
  const fileName     = document.getElementById("file-name");
  const fileSize     = document.getElementById("file-size");
  const predictBtn   = document.getElementById("predict-btn");
  const resultSec    = document.getElementById("result-section");
  const resultClass  = document.getElementById("result-class");
  const confidencePct= document.getElementById("confidence-pct");
  const barFill      = document.getElementById("bar-fill");
  const rawOutput    = document.getElementById("raw-output");
  const errorBox     = document.getElementById("error-box");

  let selectedFile = null;

  // ── Drag & Drop ─────────────────────────────────────────────────────────────
  dropZone.addEventListener("dragover", (e) => {
    e.preventDefault();
    dropZone.classList.add("dragover");
  });

  dropZone.addEventListener("dragleave", () => {
    dropZone.classList.remove("dragover");
  });

  dropZone.addEventListener("drop", (e) => {
    e.preventDefault();
    dropZone.classList.remove("dragover");
    const file = e.dataTransfer.files[0];
    if (file) handleFile(file);
  });

  fileInput.addEventListener("change", () => {
    if (fileInput.files[0]) handleFile(fileInput.files[0]);
  });

  // ── Handle selected file ────────────────────────────────────────────────────
  function handleFile(file) {
    selectedFile = file;

    // Show preview
    const reader = new FileReader();
    reader.onload = (e) => {
      previewImg.src = e.target.result;
      previewSec.classList.add("visible");
    };
    reader.readAsDataURL(file);

    // Show file meta
    fileName.textContent = file.name;
    fileSize.textContent = formatBytes(file.size);

    // Enable button, hide old results/errors
    predictBtn.disabled = false;
    resultSec.classList.remove("visible");
    hideError();
  }

  function formatBytes(bytes) {
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / (1024 * 1024)).toFixed(2) + " MB";
  }

  // ── Predict ─────────────────────────────────────────────────────────────────
  predictBtn.addEventListener("click", async () => {
    if (!selectedFile) return;

    // Loading state
    predictBtn.disabled = true;
    predictBtn.innerHTML = '<span class="spinner"></span>Classifying...';
    resultSec.classList.remove("visible");
    hideError();

    const formData = new FormData();
    formData.append("image", selectedFile);

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        body: formData
      });

      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.error || `Server error ${res.status}`);
      }

      const data = await res.json();
      showResult(data);

    } catch (err) {
      showError(err.message);
    } finally {
      predictBtn.disabled = false;
      predictBtn.textContent = "Classify Biscuit";
    }
  });

  // ── Show Result ─────────────────────────────────────────────────────────────
  function showResult(data) {
    resultClass.textContent  = data.predicted_class;
    confidencePct.textContent = data.confidence + "%";
    rawOutput.textContent    = `raw sigmoid output: ${data.raw_output}`;

    // Animate bar
    barFill.style.width = "0%";
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        barFill.style.width = data.confidence + "%";
      });
    });

    resultSec.classList.add("visible");
  }

  // ── Error ────────────────────────────────────────────────────────────────────
  function showError(msg) {
    errorBox.textContent = "⚠ " + msg;
    errorBox.classList.add("visible");
  }

  function hideError() {
    errorBox.classList.remove("visible");
  }
</script>

</body>
</html>
